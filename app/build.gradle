plugins {
    id 'com.android.application'
}

android {
    namespace 'in.gov.swachsultanpur.app'
    compileSdk 34

    defaultConfig {
        applicationId 'in.gov.swachsultanpur.app'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
